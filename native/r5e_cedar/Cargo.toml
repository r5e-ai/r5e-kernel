[package]
name = "r5e_cedar"
version = "0.1.0"
edition = "2021"
# This crate is r5e-kernel code, not protocol surface: it takes the
# repository licence. The protocol is Apache-2.0 and lives in r5e-core.
license = "AGPL-3.0-only"
publish = false

[lib]
name = "r5e_cedar"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"
cedar-policy = "=4.9.1"
serde_jcs = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
